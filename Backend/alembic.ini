[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s

# The actual URL is supplied by app.core.config so application and migration
# configuration cannot silently drift apart.
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/mail_sentinel

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
